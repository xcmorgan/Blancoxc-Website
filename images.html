
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the visual gallery by Blanco XC.">
    <title>Gallery | Blanco XC</title>
    <link rel="icon" type="image/png" href="_images/blancologo.png">
    <link rel="stylesheet" href="style.css">

    <style>
        /* GALLERY */
        .gallery-section {
            padding: 70px 6%;
            overflow: hidden;
        }

        .gallery-heading {
            margin-bottom: 35px;
        }

        .gallery-heading h1 {
            font-size: clamp(35px, 5vw, 58px);
            margin: 10px 0;
        }

        .gallery-heading h1 span {
            color: var(--accent, #d6a34a);
        }

        .gallery-heading p {
            opacity: .7;
        }

        .gallery-scroll {
            display: grid;
            grid-template-rows: repeat(2, 230px);
            grid-auto-columns: minmax(240px, 320px);
            grid-auto-flow: column;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 5px 3px 18px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: #777 transparent;
        }

        .gallery-item {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #171717;
            scroll-snap-align: start;
        }

        .gallery-image-button {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: zoom-in;
            overflow: hidden;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .35s ease;
        }

        .gallery-image-button:hover img {
            transform: scale(1.04);
        }

        /* IMAGE VIEWER */
        .gallery-lightbox {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(0, 0, 0, .94);
        }

        .gallery-lightbox.active {
            display: flex;
        }

        .gallery-lightbox img {
            display: block;
            max-width: 95%;
            max-height: 88vh;
            object-fit: contain;
        }

        .gallery-close {
            position: absolute;
            top: 20px;
            right: 25px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 38px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .gallery-section {
                padding: 45px 5%;
            }

            .gallery-scroll {
                grid-template-rows: repeat(2, 170px);
                grid-auto-columns: minmax(210px, 75vw);
                gap: 12px;
            }

            .gallery-lightbox {
                padding: 12px;
            }

            .gallery-lightbox img {
                max-width: 100%;
                max-height: 85vh;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <a href="index.html" class="logo">BLANCO<span>XC.</span></a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="beats.html">Beats</a>
        <a href="images.html" class="active">Gallery</a>
    </nav>

    <a href="beats.html" class="header-button">Explore beats ↗</a>
</header>

<main>

    <section class="gallery-section">

        <div class="gallery-heading">
            <p class="eyebrow">BLANCO XC / VISUAL COLLECTION</p>
            <h1>Selected visuals<span>.</span></h1>
            <p>A collection of ideas, creativity and visuals.</p>
        </div>

        <div class="gallery-scroll">

            <!-- IMAGE 01 -->
            <figure class="gallery-item">
                <button class="gallery-image-button"
                        data-image="_images/businessidea.png"
                        aria-label="Open Business Idea image">
                    <img src="_images/businessidea.png"
                         alt="Business Idea"
                         loading="lazy">
                </button>
            </figure>

            <!-- IMAGE 02 -->
            <figure class="gallery-item">
                <button class="gallery-image-button"
                        data-image="_images/studymode.png"
                        aria-label="Open Study Mode image">
                    <img src="_images/studymode.png"
                         alt="Study Mode"
                         loading="lazy">
                </button>
            </figure>

        </div>

    </section>

</main>

<footer class="site-footer">
    <a href="index.html" class="logo">BLANCO<span>XC.</span></a>
    <p>Music. Visuals. Creativity.</p>
    <p>© <span class="current-year"></span> Blanco XC.</p>
</footer>

<!-- IMAGE VIEWER -->
<div class="gallery-lightbox" id="galleryLightbox">
    <button class="gallery-close" id="galleryClose"
            aria-label="Close image viewer">&times;</button>

    <img src="" alt="Expanded gallery image" id="lightboxImage">
</div>

<script src="script.js"></script>

<script>
    const galleryButtons = document.querySelectorAll('.gallery-image-button');
    const lightbox = document.getElementById('galleryLightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const closeButton = document.getElementById('galleryClose');

    galleryButtons.forEach(button => {
        button.addEventListener('click', () => {
            lightboxImage.src = button.dataset.image;
            lightboxImage.alt = button.querySelector('img').alt;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
    });

    function closeGallery() {
        lightbox.classList.remove('active');
        lightboxImage.src = '';
        document.body.style.overflow = '';
    }

    closeButton.addEventListener('click', closeGallery);

    lightbox.addEventListener('click', event => {
        if (event.target === lightbox) {
            closeGallery();
        }
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
            closeGallery();
        }
    });
</script>

</body>
</html>
